name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The point of writing the merge logic in Go is that the browser runs the same
  # code. This job proves it: the whole suite, convergence properties included,
  # executed as WebAssembly under node.
  wasm:
    name: js/wasm (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test as WebAssembly
        run: |
          GOOS=js GOARCH=wasm go test \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...

  # Replay a real editing history: 259 778 edits recorded from someone writing a
  # paper, against the text they are known to produce. It is the common yardstick
  # for text CRDTs, and a correctness test no synthetic case reproduces — a
  # quarter of a million edits at positions a real person chose, with the answer
  # given in advance. The timings it prints are the ones in docs/performance.md.
  editing-trace:
    name: real editing trace
    runs-on: ubuntu-latest
    env:
      CRDT_TRACE: automerge-paper.json.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cache the trace
        id: trace
        uses: actions/cache@v4
        with:
          path: automerge-paper.json.gz
          key: editing-trace-automerge-paper-v1
      - name: Fetch the trace
        if: steps.trace.outputs.cache-hit != 'true'
        run: curl -sfLO https://raw.githubusercontent.com/josephg/editing-traces/master/sequential_traces/automerge-paper.json.gz
      # The whole suite, not one test of it.
      #
      # Several tests skip when CRDT_TRACE is unset, and this is the only lane
      # that sets it. Naming one of them here meant the others never ran
      # anywhere: TestSnapshotBudget was failing on main for two releases —
      # the columnar format added nine column lengths it did not account for —
      # and no lane could see it. A gate that runs one test is a gate that
      # hides the rest.
      - name: Replay it
        run: |
          # The trace tests skip when CRDT_TRACE is unset, so prove they did not.
          go test -v ./... | tee trace.log
          grep -q 'edits in' trace.log || {
            echo "::error::the editing-trace replay did not run"; exit 1; }
          grep -q 'runs over' trace.log || {
            echo "::error::the snapshot budget did not run"; exit 1; }
      - name: Time it
        run: go test -run '^$' -bench EditingTrace -benchtime 3x ./...

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. A CRDT has to agree with itself across
  # architectures — a replica on s390x and one on amd64 are peers in the same
  # session, and the snapshot they exchange is compared byte for byte.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  # Every decoder here reads bytes from other participants. The seed corpus runs
  # in the ordinary test job; this one spends real time looking for new inputs,
  # which is how the snapshot validation rules in docs/design.md were found.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ".",           target: FuzzParseOps }
          - { pkg: ".",           target: FuzzApply }
          - { pkg: ".",           target: FuzzLoad }
          - { pkg: ".",           target: FuzzVersionVector }
          - { pkg: ".",           target: FuzzLoadList }
          - { pkg: ".",           target: FuzzUTF16Offsets }
          - { pkg: ".",           target: FuzzParseListOps }
          - { pkg: ".",           target: FuzzLoadMap }
          - { pkg: ".",           target: FuzzParseMapOps }
          - { pkg: ".",           target: FuzzLoadComposite }
          - { pkg: ".",           target: FuzzCompositeVersion }
          - { pkg: ".",           target: FuzzParsePartOps }
          - { pkg: "./awareness", target: FuzzUpdate }
          - { pkg: "./structured", target: FuzzDecodeID }
          - { pkg: "./structured", target: FuzzDecodeCellKey }
          - { pkg: "./structured", target: FuzzSplitFieldKey }
          - { pkg: "./structured", target: FuzzDecodeCell }
          - { pkg: "./structured", target: FuzzDecodeInt }
          - { pkg: "./structured", target: FuzzDecodeBool }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # -parallel 2 rather than one worker per core.
      #
      # Fifteen of these run at once on the same runner, each starting as many
      # fuzzing workers as it sees cores, so the machine is oversubscribed
      # several times over. When the fuzz deadline arrives while a worker is
      # still in an input and cannot be reached, the coordinator reports
      # "context deadline exceeded" and the lane goes red having found nothing:
      # six million executions, no crasher, no reproducer. It went red that way
      # on #27, which changed only documentation, which is what says it is the
      # runner rather than the code.
      #
      # -timeout is separate and generous: it bounds a single input, not the
      # run, and a fuzzer that finds a genuinely slow input should still say so
      # rather than hang the lane.
      #
      # -parallel 2 made it rarer and did not stop it: it went red the same way
      # again on #34, which also changed only documentation. So the outcome is
      # told apart from a real one here rather than made less likely. A fuzzer
      # that finds something writes it to testdata/fuzz and says so; a run with
      # no failing input, whose only complaint is the coordinator's own
      # deadline, found nothing and is reported as having found nothing.
      #
      # Every other failure is still a failure, including a deadline in a run
      # that did write an input.
      - name: Fuzz ${{ matrix.target }}
        run: |
          set -o pipefail
          if go test -run '^$' -fuzz '^${{ matrix.target }}$' \
              -fuzztime 120s -parallel 2 -timeout 10m ${{ matrix.pkg }} 2>&1 | tee fuzz.log; then
            exit 0
          fi
          if grep -q 'Failing input written to' fuzz.log; then
            echo "::error::${{ matrix.target }} found a failing input"
            exit 1
          fi
          if grep -q 'context deadline exceeded' fuzz.log; then
            execs=$(grep -o 'execs: [0-9]*' fuzz.log | tail -1)
            echo "::warning::${{ matrix.target }}: the fuzz deadline arrived while a worker was still in an input; ${execs:-no execs reported}, no failing input. The loaded runner, not the code."
            exit 0
          fi
          exit 1
      - name: Upload any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: testdata/fuzz/
