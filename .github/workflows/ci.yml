name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      # A workflow whose shell is broken is still valid YAML. An edit that split
      # one of these run blocks in half parsed fine, passed a yaml.safe_load
      # check, and only failed on the runner with "unexpected end of file". So
      # the shell is parsed here too, which is the control that catches it.
      # A workflow whose shell is broken is still valid YAML: an edit here split
      # a run block between a loop's body and its `done`, parsed, and failed on
      # the runner (#138).
      #
      # actionlint is the tool for this and it already existed -- a Go program
      # that runs shellcheck over every run block and also checks the workflow's
      # schema, its expressions and its runner labels. Two things measured on
      # 2026-10-08 before trusting it: at the default severity it fails on
      # STYLE, so shellcheck is asked for errors only, where it still catches an
      # unclosed loop (SC1061/SC1062/SC1072) and an unterminated heredoc
      # (SC1044/SC1072/SC1073); and it SKIPS shellcheck silently when it cannot
      # find it -- exit 0, no output -- so its presence is asserted first.
      - name: Every run block must parse as shell
        run: |
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not installed, and actionlint would skip it and pass"
            exit 1
          }
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck="shellcheck -S error" .github/workflows/ci.yml

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan, and judge the findings rather than the exit status
        run: |
          # This module requires nothing, so the subject is the standard
          # library: the half nobody thinks to scan, and the half a toolchain
          # bump changes underneath you.
          #
          # The exit status is not the gate. Measured in the sibling repository
          # on GO-2026-6443, govulncheck exits 0 over an advisory it decides a
          # module does not call. tools/vulngate reads the findings, and unlike
          # an inline script it has tests of its own.
          govulncheck -format json ./... > findings.json
          cd tools && go run ./vulngate ../findings.json

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          "$GITHUB_WORKSPACE/.github/coverage-gate.sh" cover.out

  # The point of writing the merge logic in Go is that the browser runs the same
  # code. This job proves it: the whole suite, convergence properties included,
  # executed as WebAssembly under node.
  wasm:
    name: js/wasm (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test as WebAssembly
        run: |
          GOOS=js GOARCH=wasm go test \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...

  # Replay a real editing history: 259 778 edits recorded from someone writing a
  # paper, against the text they are known to produce. It is the common yardstick
  # for text CRDTs, and a correctness test no synthetic case reproduces — a
  # quarter of a million edits at positions a real person chose, with the answer
  # given in advance. The timings it prints are the ones in docs/performance.md.
  editing-trace:
    name: real editing trace
    runs-on: ubuntu-latest
    env:
      CRDT_TRACE: automerge-paper.json.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Cache the trace
        id: trace
        uses: actions/cache@v6
        with:
          path: automerge-paper.json.gz
          key: editing-trace-automerge-paper-v1
      - name: Fetch the trace
        if: steps.trace.outputs.cache-hit != 'true'
        run: curl -sfLO https://raw.githubusercontent.com/josephg/editing-traces/master/sequential_traces/automerge-paper.json.gz
      # The whole suite, not one test of it.
      #
      # Several tests skip when CRDT_TRACE is unset, and this is the only lane
      # that sets it. Naming one of them here meant the others never ran
      # anywhere: TestSnapshotBudget was failing on main for two releases —
      # the columnar format added nine column lengths it did not account for —
      # and no lane could see it. A gate that runs one test is a gate that
      # hides the rest.
      - name: Replay it
        run: |
          # The trace tests skip when CRDT_TRACE is unset, so prove they did not.
          go test -v ./... | tee trace.log
          grep -q 'edits in' trace.log || {
            echo "::error::the editing-trace replay did not run"; exit 1; }
          grep -q 'runs over' trace.log || {
            echo "::error::the snapshot budget did not run"; exit 1; }
      - name: Time it
        run: go test -run '^$' -bench EditingTrace -benchtime 3x ./...

  # Run the suite on the supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. A CRDT has to agree with itself across
  # architectures — a replica on s390x and one on amd64 are peers in the same
  # session only if they write the same bytes.
  #
  # That comparison is real and it is in the suite these lanes run:
  # TestTheEncodingIsTheSameBytesEverywhere builds one document from a fixed
  # script and compares its snapshot against testdata/golden-composite.snapshot,
  # so every lane is compared against the SAME file rather than against itself.
  # Big-endian s390x and little-endian amd64 agreeing with that file is the two
  # of them agreeing with each other. (This comment used to claim the lanes
  # exchanged a snapshot and compared it byte for byte; nothing did, until the
  # golden file.)
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - run: go env GOARCH && go test ./...

  # The 32-bit targets, built and vetted rather than run: qemu-user for them is
  # another install and another hour, and what a 32-bit target risks is a width,
  # not a behaviour — an int64 narrowed to int, a length that wraps. The
  # compiler catches those, and until this lane existed nothing did: the
  # structured package's tests could not be BUILT for any 32-bit GOARCH (a
  # 1<<60 constant), so a lane added later would have failed before running
  # anything.
  arch-32bit:
    name: arch ${{ matrix.goarch }} (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [386, arm, mips]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Build and vet, tests included
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          go vet ./...
          go test -c -o /dev/null ./...
          go test -c -o /dev/null ./structured
          go test -c -o /dev/null ./awareness

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      # apt has sat on this step for the better part of an hour, more than once,
      # on nothing this repository does. It is bounded and retried rather than
      # waited on, and bounding it is what identified the culprit: three
      # attempts of ten minutes each produced not one line of output from
      # apt-get update, while the install itself was never reached.
      #
      # The runner image already ships apt's package lists, so the install
      # usually needs no refresh at all. It is tried on the lists that are there
      # first, and they are only refreshed if that was not enough. apt is also
      # told to give up on a stuck mirror rather than sit on it, which is what
      # made the outer timeout the only thing stopping it.
      - name: Install qemu-user-static
        run: |
          apt=(-y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "::warning::the runner's package lists were not enough; refreshing them (attempt $attempt)"
            timeout 240 sudo apt-get update "${apt[@]}" || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get install "${apt[@]}" qemu-user-static; then
              exit 0
            fi
          done
          echo "::error::qemu-user-static could not be installed"
          exit 1
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  # Every decoder here reads bytes from other participants. The seed corpus runs
  # in the ordinary test job; this one spends real time looking for new inputs,
  # which is how the snapshot validation rules in docs/design.md were found.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ".",           target: FuzzParseOps }
          - { pkg: ".",           target: FuzzApply }
          - { pkg: ".",           target: FuzzLoad }
          - { pkg: ".",           target: FuzzVersionVector }
          - { pkg: ".",           target: FuzzLoadList }
          - { pkg: ".",           target: FuzzUTF16Offsets }
          - { pkg: ".",           target: FuzzParseListOps }
          - { pkg: ".",           target: FuzzLoadMap }
          - { pkg: ".",           target: FuzzParseMapOps }
          - { pkg: ".",           target: FuzzLoadComposite }
          - { pkg: ".",           target: FuzzCompositeVersion }
          - { pkg: ".",           target: FuzzCompositeClocks }
          - { pkg: ".",           target: FuzzParsePartOps }
          - { pkg: "./awareness", target: FuzzUpdate }
          - { pkg: "./structured", target: FuzzDecodeID }
          - { pkg: "./structured", target: FuzzDecodeCellKey }
          - { pkg: "./structured", target: FuzzSplitFieldKey }
          - { pkg: "./structured", target: FuzzDecodeCell }
          - { pkg: "./structured", target: FuzzDecodeInt }
          - { pkg: "./structured", target: FuzzDecodeBool }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2

      # What a target found last time, so that 120 seconds a run accumulate
      # rather than starting over. go test writes the inputs it found
      # interesting under $GOCACHE/fuzz and reads them back on the next run;
      # without a cache the lane discards them when the runner goes away.
      #
      # Keyed per pkg AND target, because this is a matrix: twenty-one jobs
      # sharing one key would race to write it and each would restore whatever
      # another target left. The hostile lane next door is a single job and so
      # keys without one -- measured on main, it entered with 653 inputs and
      # left with 664, which is what this lane has been throwing away.
      - name: Locate the fuzz corpus
        run: echo "FUZZ_CORPUS=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      - name: Restore the corpus for ${{ matrix.pkg }} ${{ matrix.target }}
        uses: actions/cache@v6
        with:
          path: ${{ env.FUZZ_CORPUS }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.pkg }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ matrix.pkg }}-${{ matrix.target }}-
      - name: What the corpus arrived with
        run: |
          n=$(find "$FUZZ_CORPUS" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "corpus on entry: ${n:-0} inputs"
          echo "FUZZ_CORPUS_IN=${n:-0}" >> "$GITHUB_ENV"

      # -parallel 2 rather than one worker per core.
      #
      # Fifteen of these run at once on the same runner, each starting as many
      # fuzzing workers as it sees cores, so the machine is oversubscribed
      # several times over. When the fuzz deadline arrives while a worker is
      # still in an input and cannot be reached, the coordinator reports
      # "context deadline exceeded" and the lane goes red having found nothing:
      # six million executions, no crasher, no reproducer. It went red that way
      # on #27, which changed only documentation, which is what says it is the
      # runner rather than the code.
      #
      # -timeout is separate and generous: it bounds a single input, not the
      # run, and a fuzzer that finds a genuinely slow input should still say so
      # rather than hang the lane.
      #
      # -parallel 2 made it rarer and did not stop it: it went red the same way
      # again on #34, which also changed only documentation. So the outcome is
      # told apart from a real one here rather than made less likely. A fuzzer
      # that finds something writes it to testdata/fuzz and says so; a run with
      # no failing input, whose only complaint is the coordinator's own
      # deadline, found nothing and is reported as having found nothing.
      #
      # Every other failure is still a failure, including a deadline in a run
      # that did write an input.
      - name: Fuzz ${{ matrix.target }}
        run: |
          set -o pipefail
          if go test -run '^$' -fuzz '^${{ matrix.target }}$' \
              -fuzztime 120s -parallel 2 -timeout 10m ${{ matrix.pkg }} 2>&1 | tee fuzz.log; then
            exit 0
          fi
          if grep -q 'Failing input written to' fuzz.log; then
            echo "::error::${{ matrix.target }} found a failing input"
            exit 1
          fi
          if grep -q 'context deadline exceeded' fuzz.log; then
            execs=$(grep -o 'execs: [0-9]*' fuzz.log | tail -1)
            echo "::warning::${{ matrix.target }}: the fuzz deadline arrived while a worker was still in an input; ${execs:-no execs reported}, no failing input. The loaded runner, not the code."
            exit 0
          fi
          exit 1
      - name: What the corpus leaves with
        if: always()
        run: |
          n=$(find "$FUZZ_CORPUS" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "corpus on exit: ${n:-0} inputs (entered with $FUZZ_CORPUS_IN)"
          if [ "${n:-0}" -lt "$FUZZ_CORPUS_IN" ]; then
            echo "::warning::the corpus shrank; the cache is not carrying what this lane finds"
          fi
      - name: Upload any failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: testdata/fuzz/

  # The hostile targets, which the matrix above does not name.
  #
  # structured/hostile_test.go holds fifteen of this module's thirty-five fuzz
  # targets, and none of them was fuzzed: they ran their seed corpus and stopped.
  # That is the file whose whole purpose is bytes nobody should have sent.
  #
  # Batched into ONE job rather than added to the matrix, and that is the point of
  # it. The comment on the matrix above says fifteen parallel fuzzers already
  # oversubscribe a runner several times over, and that this is what makes the
  # coordinator report a deadline having found nothing. Fifteen more would make a
  # known false-red more likely, so these share one slot instead: at 700 000 to a
  # million executions in ten seconds on a laptop, 30 seconds each is ample, and
  # the whole batch costs less wall-clock than one lane of the matrix.
  #
  # Every target runs even after one fails, because a fuzz lane that stops at the
  # first finding tells you less than it found.
  fuzz-hostile:
    name: fuzz (hostile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      # What `go test -fuzz` discovers lives in $GOCACHE/fuzz, and setup-go's
      # cache does restore -- the logs say "Cache restored successfully" -- but on
      # an exact key hit actions/cache does not write back, so nothing discovered
      # here was ever saved. Measured in the logs of a real run: these targets
      # start from a baseline corpus of 1 to 6 inputs, which is the seeds in
      # testdata/fuzz and nothing else, every time.
      #
      # That matters because 30 seconds is not where these targets finish. On a
      # cleared cache, four of them found 33-50 interesting inputs in the first
      # 30 seconds and 56-60 by 120 seconds, and two were still finding new
      # coverage at the 120-second mark. Each run was therefore stopping in the
      # steep part of its own discovery curve and then throwing the result away.
      #
      # The key carries the run number so every run saves, and restore-keys picks
      # up the most recent previous one. GitHub evicts least-recently-used, which
      # is the pruning this wants.
      # Asked of Go rather than written down: a cache whose path does not exist
      # restores nothing, saves nothing, and reports success either way.
      - name: Locate the fuzz corpus
        run: echo "FUZZ_CORPUS=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"
      - name: Restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.FUZZ_CORPUS }}
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-
      # The corpus is counted on the way in and on the way out, because a cache
      # that restores nothing and a cache that works report the same success.
      # Two runs of this lane on main with the second number no larger than the
      # first mean it is not accumulating, whatever the cache step says.
      - name: What the corpus arrived with
        run: |
          n=$(find "$FUZZ_CORPUS" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "corpus on entry: ${n:-0} inputs"
          echo "FUZZ_CORPUS_IN=${n:-0}" >> "$GITHUB_ENV"
      - name: Fuzz every hostile target
        run: |
          targets=$(grep -rhoE 'func (Fuzz[A-Za-z0-9_]+)' structured/hostile_test.go | awk '{print $2}' | sort)
          if [ -z "$targets" ]; then
            echo "::error::no hostile fuzz targets found; this lane has stopped asking anything"
            exit 1
          fi
          echo "targets: $(echo $targets | tr '\n' ' ')"
          failed=""
          for t in $targets; do
            echo "--- $t"
            if go test -run '^$' -fuzz "^$t\$" -fuzztime 30s -parallel 2 \
                -timeout 5m ./structured 2>&1 | tee fuzz.log; then
              continue
            fi
            if grep -q 'Failing input written to' fuzz.log; then
              echo "::error::$t found a failing input"
              failed="$failed $t"
              continue
            fi
            if grep -q 'context deadline exceeded' fuzz.log; then
              execs=$(grep -o 'execs: [0-9]*' fuzz.log | tail -1)
              echo "::warning::$t: the fuzz deadline arrived while a worker was still in an input; ${execs:-no execs reported}, no failing input. The loaded runner, not the code."
              continue
            fi
            echo "::error::$t failed"
            failed="$failed $t"
          done
          if [ -n "$failed" ]; then
            echo "::error::these targets failed:$failed"
            exit 1
          fi
      - name: What the corpus leaves with
        if: always()
        run: |
          n=$(find "$FUZZ_CORPUS" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "corpus on exit: ${n:-0} inputs (entered with $FUZZ_CORPUS_IN)"
          if [ "${n:-0}" -lt "$FUZZ_CORPUS_IN" ]; then
            echo "::warning::the corpus shrank; the cache is not carrying what this lane finds"
          fi

      - name: Upload any failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-hostile
          path: structured/testdata/fuzz/
